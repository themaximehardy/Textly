name: Release

# Push a tag like v0.4.0 to build the DMG and publish a GitHub release.
# Or: Actions > Release > Run workflow. With a tag (e.g. v0.3.0) the DMG is attached to that existing release;
# without one, the DMG is only kept with the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the DMG to this release tag (e.g. v0.3.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build DMG
        run: bash scripts/make-dmg.sh

      - name: Keep the DMG with this run
        uses: actions/upload-artifact@v4
        with:
          name: Textly-dmg
          path: dist/*.dmg

      - name: Release notes from CHANGELOG.md
        if: env.TAG != ''
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          1. Download **Textly-*.dmg** below, open it and drag Textly to Applications.
          2. Open Textly. macOS says it can't verify the app (it isn't notarised yet): click **Done**, then **System Settings › Privacy & Security › Open Anyway**. Only the first time.
          3. Follow the setup window: OpenRouter API key (or a local model with Ollama or LM Studio), your languages, then Accessibility permission.
          4. Already have Textly? Quit it, then replace it in Applications. If the shortcut stops working, remove Textly from System Settings › Privacy & Security › Accessibility and add it again.
          NOTES

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.dmg
          body_path: notes.md

name: Release

# Push a tag like v0.4.0 to build the DMG and publish a GitHub release.
# Or: Actions > Release > Run workflow. With a tag (e.g. v0.3.0) the DMG is attached to that existing release;
# without one, the DMG is only kept with the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the DMG to this release tag (e.g. v0.3.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      # Developer ID signing and notarisation (see docs/SIGNING.md). Without these secrets the DMG is signed ad hoc.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Load the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application certificate in MACOS_CERTIFICATE"; exit 1; fi
          echo "Signing as: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Load the notarisation key
        if: env.NOTARY_API_KEY != ''
        run: |
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build DMG
        run: bash scripts/make-dmg.sh

      - name: Keep the DMG with this run
        uses: actions/upload-artifact@v4
        with:
          name: Textly-dmg
          path: dist/*.dmg

      - name: Release notes from CHANGELOG.md
        if: env.TAG != ''
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          1. Download **Textly-*.dmg** below, open it and drag Textly to Applications.
          2. Open Textly. (If macOS says it can't verify the app, this build isn't notarised: click **Done**, then **System Settings › Privacy & Security › Open Anyway**.)
          3. Follow the setup window: OpenRouter API key (or a local model with Ollama or LM Studio), your languages, then Accessibility permission.
          4. Already have Textly? Quit it, then replace it in Applications. If the shortcut stops working, remove Textly from System Settings › Privacy & Security › Accessibility and add it again.
          NOTES

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.dmg
          body_path: notes.md
